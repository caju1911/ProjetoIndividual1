<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraplano</title>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>
    <nav class="navbar">
        <a href="#"></a>
        <a href="homepage.html"><img src="img/logo.svg" alt="Logo" class="logo"></a>
        <div class="links">
        <a href="dashboard.html" class="dashboard">Dashboard</a>
        <a href="historicoFilmes.html" class="historico">Histórico</a>
        </div>

    </nav>

    <div class="secao" id="cadastro">

        <h1 class="it">Cadastra-se</h1>
        <div class="divisor"></div>

        <div class="lista">
            <div class="card">
                <div class="formulario">

                    <span class="descricao">Código de ativação:</span>
                    <input type="text" id="codigo_input">

                    <span class="descricao">Insira seu nome:</span>
                    <input type="text" id="nome_input">

                    <span class="descricao">Insira seu e-mail:</span>
                    <input type="text" id="email_input">

                    <span class="descricao">Insira sua senha:</span>
                    <h5>Sua senha deve conter no mínimo 8 caracteres e pelo menos uma letra maíuscula</h5>
                    <input type="password" id="senha_input">
                    

                    <span class="descricao">Confirme sua senha:</span>
                    <input type="password" id="confirmacao_senha_input">

                    <button onclick="cadastrar()" class="buttonCadastro">Cadastrar</button>
                    <p><a href="login.html">Já possui conta? Clique aqui!</a></p>
                    <div id="mensagem_erro"></div>

                </div>
            </div>
        </div>


    </div>
</body>
</html>
<script>

  function cadastrar() {
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var codigoVar = codigo_input.value;

    let campos = [nomeVar, emailVar, senhaVar, confirmacaoSenhaVar, codigoVar]

    for (let i = 0; i < campos.length; i++){
      if (campos[i] == 0){
      alert('Preencha todos os campos!');
      return false;
    }
    }
      
    if (senhaVar.length < 8){
      mensagem_erro.innerHTML = `Insira uma senha com pelo menos 8 caracteres!`
    } else if (senhaVar.toLowerCase() == senhaVar){
      mensagem_erro.innerHTML = `A senha deve ter um caracter maiúsculo`
    } else if (senhaVar != confirmacaoSenhaVar){
      mensagem_erro.innerHTML = `As senhas não coincidem!`
    } else if (!(emailVar.includes('@'))){
      mensagem_erro.innerHTML = `O seu e-mail deve conter @!`
    } else if (!(emailVar.includes('.'))){
      mensagem_erro.innerHTML = `Seu email deve terminar com algum domínio!`
    } else {
      
      
      fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        codigoServer: codigoVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

        } else {
          mensagem_erro.innerHTML = "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

    return false; 



    }

    

  }

</script>
