<script>

  let metaMensal = 0
  let metaAnual = 0

  function alterarMetaMensal(){
    let alterarMensal = prompt('Insira sua nova meta:');
    metaMensal = Number(alterarMensal);
    div_msgMensal.innerHTML = `Meta mensal: ${metaMensal}`
  }

  function alterarMetaAnual (){
    let alterarAnual = prompt('Insira sua nova meta:');
    metaAnual = Number(alterarAnual);
    div_msgAnual.innerHTML = `Metal anual: ${metaAnual}`
  }


  let graficoMeses  = document.getElementById('graficoMeses');

  new Chart(graficoMeses, {
    type: 'line',
    data: {
      labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
      datasets: [{
        label: '# of Votes',
        data: [12, 19, 3, 5, 2, 3],
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
});


  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

  let filmes = [];


  function obterDadosGraficoGenero() {

    fetch(`/dashboard/listarGeneros/${sessionStorage.ID_USUARIO}`, { cache: 'no-store' }).then(function (response) {
      if (response.ok) {
        response.json().then(function (resposta) {
          console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

          plotarGrafico(resposta, 'graficoGeneros');
        });
      } else {
        console.error('Nenhum dado encontrado ou erro na API');
      }
    })
      .catch(function (error) {
        console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
      });
  }

  function obterDadosGraficoPaises() {
     fetch(`/dashboard/listarPaises/${sessionStorage.ID_USUARIO}`, { cache: 'no-store' }).then(function (response) {
      if (response.ok) {
        response.json().then(function (resposta) {
          console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

          plotarGrafico(resposta, 'graficoPaises');
        });
      } else {
        console.error('Nenhum dado encontrado ou erro na API');
      }
    })
      .catch(function (error) {
        console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
      });

  }

    function obterDadosGraficoDiretores() {
     fetch(`/dashboard/listarDiretores/${sessionStorage.ID_USUARIO}`, { cache: 'no-store' }).then(function (response) {
      if (response.ok) {
        response.json().then(function (resposta) {
          console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

          plotarGrafico(resposta, 'graficoDiretores');
        });
      } else {
        console.error('Nenhum dado encontrado ou erro na API');
      }
    })
      .catch(function (error) {
        console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
      });

  }

  function plotarGrafico(resposta, idCanvas) {

    console.log('iniciando plotagem do gráfico...');


    let labels = [];

    let dados = {
      labels: labels,
      datasets: [{
        label: 'Filmes',
        data: [],
        borderWidth: 1
      }]
    };

    console.log('----------------------------------------------')
    console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
    console.log(resposta)


    for (let i = 0; i < resposta.length; i++) {
    var registro = resposta[i];
    labels.push(registro.nome);
    dados.datasets[0].data.push(registro.total);
  }

    console.log('----------------------------------------------')
    console.log('O gráfico será plotado com os respectivos valores:')
    console.log('Labels:')
    console.log(labels)
    console.log('Dados:')
    console.log(dados.datasets)
    console.log('----------------------------------------------')


    const config = {
      type: 'pie',
      data: dados,
    };

    let myChart = new Chart(
      document.getElementById(idCanvas),
      config
    );

  }


 
function obterKPIs() {
  fetch(`/dashboard/listarKPIs/${sessionStorage.ID_USUARIO}`, { cache: 'no-store' }).then(function (response) {
    if (response.ok) {
      response.json().then(function (resposta) {
        console.log(`KPIs recebidos: ${JSON.stringify(resposta)}`);

        kpiMes.innerHTML = resposta[0].totalMes;
        kpiAno.innerHTML = resposta[0].totalAno;
      });
    } else {
      console.error(`Erro ao buscar os KPIs. Status: ${response.status}`);
    }
  })
    .catch(function (error) {
      console.error(`Erro na obtenção dos dados dos KPIs: ${error.message}`);
    });
}



window.onload = function () {
  obterDadosGraficoGenero();
  obterDadosGraficoPaises();
  obterDadosGraficoDiretores();
  obterKPIs();
};

</script>
