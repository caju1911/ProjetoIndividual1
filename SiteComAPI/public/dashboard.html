<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <nav class="navbar">

        <a href="login.html" class="entrar"><img src="img/login.svg" alt="Login">Entrar</a>
    </nav>


    <div id="hero">

    <h1>
    <span class="it">olá, <span id="b_usuario">usuário</span><br></span>
    </h1>
    
    <img src="img/florascii.png" class="logo">

    <span class="p">Estastíticas pessoais</span>

    </div>


    <div class="kpi">
        <div class="card">
            <p class="textoSimples1">Filmes vistos este mês:</p>
            <p class="textoSimples2" id="kpiMes">4</p>
            <p class="textoSimples1">

            </p>
            <button onclick="alterarMetaMensal()" class="buttonAlterar">Alterar meta do mês</button>
        </div>

        <div class="card">
            <p class="textoSimples1">Filmes vistos este ano:</p>
            <p class="textoSimples2" id="kpiAno">40</p>

            <div id="div_msgAnual"></div>

        <div class="buttons">

            <button class="buttonCadastrar">Cadastrar nova resenha</button>

    <div class="graficos">


    <div class="cardGrafico">
        <p class="textoSimples1">Filmes por gênero</p>
        <div class="areaGrafico">
            <canvas id="graficoGeneros"></canvas>
        </div>
    </div>


    <div class="cardGrafico">
        <p class="textoSimples1">Filmes por país</p>
        <div class="areaGrafico">
            <canvas id="graficoPais"></canvas>
        </div>
    </div>



    <div class="cardGrafico">
        <p class="textoSimples1">Diretores mais vistos</p>
        <div class="areaGrafico">
            <canvas id="graficoDiretores"></canvas>
        </div>
    </div>


    <div class="cardGrafico">
        <p class="textoSimples1">Acompanhamento mensal</p>
        <div class="areaGrafico">

        </div>
    </div>
</div>

</html>
<script>

  let metaMensal = 0
  let metaAnual = 0

  function alterarMetaMensal(){
    let alterarMensal = prompt('Insira sua nova meta:');
    metaMensal = Number(alterarMensal);
    div_msgMensal.innerHTML = `Meta mensal: ${metaMensal}`
  }

  function alterarMetaAnual (){
    let alterarAnual = prompt('Insira sua nova meta:');
    metaAnual = Number(alterarAnual);
    div_msgAnual.innerHTML = `Metal anual: ${metaAnual}`
  }



  let graficoPais  = document.getElementById('graficoPais');

  new Chart(graficoPais, {
    type: 'pie',
    data: {
      labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
      datasets: [{
        label: '# of Votes',
        data: [12, 19, 3, 5, 2, 3],
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
});

  let graficoDiretores  = document.getElementById('graficoDiretores');

  new Chart(graficoDiretores, {
    type: 'pie',
    data: {
      labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
      datasets: [{
        label: '# of Votes',
        data: [12, 19, 3, 5, 2, 3],
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
});

  let graficoMeses  = document.getElementById('graficoMeses');

  new Chart(graficoMeses, {
    type: 'line',
    data: {
      labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
      datasets: [{
        label: '# of Votes',
        data: [12, 19, 3, 5, 2, 3],
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
});


  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

  let filmes = [];
  let proximaAtualizacao;

  function obterDadosGrafico() {

    if (proximaAtualizacao != undefined) {
      clearTimeout(proximaAtualizacao);
    }

    fetch(`/filmes/listar/${sessionStorage.ID_USUARIO}`, { cache: 'no-store' }).then(function (response) {
      if (response.ok) {
        response.json().then(function (resposta) {
          console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

          filmes = resposta;
          calcularKPIs();
          plotarGrafico(resposta);
        });
      } else {
        console.error('Nenhum dado encontrado ou erro na API');
      }
    })
      .catch(function (error) {
        console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
      });
  }


  function plotarGrafico(resposta) {

    console.log('iniciando plotagem do gráfico...');


    let labels = [];

    let dados = {
      labels: labels,
      datasets: [{
        label: 'Filmes',
        data: [],
        borderWidth: 1
      }]
    };

    console.log('----------------------------------------------')
    console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
    console.log(resposta)


    for (let i = 0; i < resposta.length; i++) {
      let genero = resposta[i].genero;
      let posicao = labels.indexOf(genero);

      if (posicao == -1) {
        labels.push(genero);
        dados.datasets[0].data.push(1);
      } else {
        dados.datasets[0].data[posicao]++;
      }
    }

    console.log('----------------------------------------------')
    console.log('O gráfico será plotado com os respectivos valores:')
    console.log('Labels:')
    console.log(labels)
    console.log('Dados:')
    console.log(dados.datasets)
    console.log('----------------------------------------------')


    const config = {
      type: 'pie',
      data: dados,
    };

    let myChart = new Chart(
      document.getElementById('graficoGeneros'),
      config
    );
  }

 
  function calcularKPIs() {
    let hoje = new Date();
    let mesAtual = hoje.getMonth();
    let anoAtual = hoje.getFullYear();

    let filmesMes = 0;
    let filmesAno = 0;

    for (let i = 0; i < filmes.length; i++) {
      let data = new Date(filmes[i].dataVisto);

      if (data.getFullYear() == anoAtual) {
        filmesAno++;

        if (data.getMonth() == mesAtual) {
          filmesMes++;
        }
      }
    }

    kpiMes.innerHTML = filmesMes;
    kpiAno.innerHTML = filmesAno;
  }

  window.onload = obterDadosGrafico;

</script>
