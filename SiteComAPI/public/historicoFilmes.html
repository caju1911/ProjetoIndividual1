<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraplano</title>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/historico.css">
</head>
<body onload="carregarHistorico()">
    <nav class="navbar">
        <a href="#"></a>
        <a href="homepage.html"><img src="img/logo.svg" alt="Logo" class="logo"></a>
        <a href="dashboard.html" class="entrar"><img src="img/pessoa.png" alt="Perfil"></a>
    </nav>

    <div class="secao" id="historico">
        <h1 class="it">Histórico</h1>
        <div class="filtro">
    <span>Selecione um filtro:</span>

    <select id="slt_filtro" onchange="escolherFiltro()">
        <option value="#" selected disabled>Selecione uma opção</option>
        <option value="1">Gênero</option>
    </select>

    <div class="filtro-genero" id="filtro_genero">
        <span>Selecione o gênero:</span>
        <select id="slt_genero"></select>
    </div>

    <button onclick="filtrar()">Filtrar histórico</button>
    <button onclick="limpar()">Limpar filtro</button>
</div>
        <div class="divisor"></div>

        <div class="lista-filmes" id="lista_filmes"></div>

        
<div class="paginacao">
    <button id="btn_anterior" onclick="mudarPagina(-1)">Anterior</button>
    <span id="texto_pagina"></span>
    <button id="btn_proximo" onclick="mudarPagina(1)">Próxima</button>
</div>
    </div>

    <div class="modal" id="modal_editar">
    <div class="modal-card">
        <h2 class="modal-titulo">Editar filme</h2>

        <span class="descricao">Nome do filme:</span>
        <input type="text" id="editar_nome">

        <span class="descricao">Ano de lançamento:</span>
        <input type="text" id="editar_ano">

        <span class="descricao">Diretor(a):</span>
        <input type="text" id="editar_diretor">

        <span class="descricao">País:</span>
        <input type="text" id="editar_pais">

        <span class="descricao">Gênero:</span>
        <input type="text" id="editar_genero">

        <div class="modal-botoes">
            <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
            <button class="btn-salvar" onclick="salvarEdicao()">Salvar</button>
        </div>
    </div>
</div>
</body>
</html>
<script>
    let listaFilmes = [];
    let idFilmeEditando = 0;
    let listaAtual = [];
    let paginaAtual = 1;
    let filmesPorPagina = 5;
    
    function carregarHistorico(){

    fetch(`/dashboard/listar/${sessionStorage.ID_USUARIO}`)
        .then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (filmes) {
                    listaFilmes = filmes;
                    exibirFilmes(filmes);
                });
            } else {
                lista_filmes.innerHTML = "<div class='vazio'>Não foi possível carregar o histórico.</div>";
            }
        })
        .catch(function (erro) {
            console.log(`#ERRO: ${erro}`);
        });
}

    function exibirFilmes(filmes){
        lista_filmes.innerHTML = ``

        if (filmes.length == 0){
            lista_filmes.innerHTML = `<div class='vazio'>Não foi possível carregar o histórico.</div>"`
        } else {
            for (let i = filmes.length - 1; i >= 0; i--){
                let filme = filmes[i];
                let dataVisto = filme.dataVisto.slice(8, 10) + "/" + filme.dataVisto.slice(5, 7) + "/" + filme.dataVisto.slice(0, 4);
                lista_filmes.innerHTML += `
                    <div class="filme">
                        <div class="filme-topo">
                            <span class="filme-nome">${filme.nomeFilme}</span>
                                <div class="filme-direita">
                                    <span class="filme-data">Visto em ${dataVisto}</span>
                                    <div class="menu">
                                    <button class="btn-pontos" onclick="abrirMenu(${filme.idFilme})">⋮</button>
                                    <div class="menu-opcoes" id="menu_${filme.idFilme}">
                                <button onclick="editarFilme(${filme.idFilme})">Editar</button>
                        <button class="deletar" onclick="deletarFilme(${filme.idFilme})">Deletar</button>
                    </div>
                </div>
            </div>
        </div>
        <span class="filme-info">${filme.anoFilme} · ${filme.nomeDiretor} · ${filme.paisFilme}</span>
        <span class="filme-genero">${filme.genero}</span>
    </div>`

            }
        }
    }

    function abrirMenu(idFilme){
    const menus = document.getElementsByClassName("menu-opcoes");

    for (let i = 0; i < menus.length; i++){
        if (menus[i].id != `menu_${idFilme}`){
            menus[i].classList.remove("aberto");
        }
    }

    document.getElementById(`menu_${idFilme}`).classList.toggle("aberto");
}

function editarFilme(idFilme){
    for (let i = 0; i < listaFilmes.length; i++){
        if (listaFilmes[i].idFilme == idFilme){
            editar_nome.value = listaFilmes[i].nomeFilme;
            editar_ano.value = listaFilmes[i].anoFilme;
            editar_diretor.value = listaFilmes[i].nomeDiretor;
            editar_pais.value = listaFilmes[i].paisFilme;
            editar_genero.value = listaFilmes[i].genero;
        }
    }

    idFilmeEditando = idFilme;
    document.getElementById(`menu_${idFilme}`).classList.remove("aberto");  
    modal_editar.classList.add("aberto");
}

function fecharModal(){
    modal_editar.classList.remove("aberto");
}

function salvarEdicao(){
    console.log(`salvar a edição do filme ${idFilmeEditando}`);
}

function deletarFilme(idFilme){
    if (confirm("Tem certeza que deseja deletar este filme?")) {
        fetch(`/filmes/deletar/${idFilme}/${sessionStorage.ID_USUARIO}`, {
            method: "DELETE"
        })
            .then(function (resposta) {
                if (resposta.ok) {
                    carregarHistorico(); 
                } else {
                    alert("Não foi possível deletar o filme.");
                }
            })
            .catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
            });
    }
}

function salvarEdicao(){
    let campos = [editar_nome, editar_ano, editar_diretor, editar_pais, editar_genero];
    let camposVazios = 0;

    for (let i = 0; i < campos.length; i++){
        if (campos[i].value == ""){
            camposVazios++;
        }
    }

    if (camposVazios > 0) {
        alert("Preencha todos os campos.");
    } else {
        fetch(`/filmes/editar/${idFilmeEditando}/${sessionStorage.ID_USUARIO}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeServer: editar_nome.value,
                anoServer: editar_ano.value,
                diretorServer: editar_diretor.value,
                paisServer: editar_pais.value,
                generoServer: editar_genero.value
            }),
        })
            .then(function (resposta) {
                if (resposta.ok) {
                    fecharModal();
                    carregarHistorico();
                } else {
                    alert("Não foi possível editar o filme.");
                }
            })
            .catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
            });
    }
}

function escolherFiltro(){
    if (slt_filtro.value == 1){
        let generos = [];
        slt_genero.innerHTML = `<option value="#" selected disabled>Selecione um gênero</option>`;

        for (let i = 0; i < listaFilmes.length; i++){
            if (generos.includes(listaFilmes[i].genero) == false){
                generos.push(listaFilmes[i].genero);
                slt_genero.innerHTML += `<option value="${listaFilmes[i].genero}">${listaFilmes[i].genero}</option>`;
            }
        }

        filtro_genero.classList.add("aberto");
    }
}


function filtrar(){
    if (slt_filtro.value == 1){
        let genero = slt_genero.value;
        let filmesFiltrados = [];

        if (genero == "#"){
            alert("Selecione um gênero.");
        } else {
            for (let i = 0; i < listaFilmes.length; i++){
                if (listaFilmes[i].genero == genero){
                    filmesFiltrados.push(listaFilmes[i]);
                }
            }

            exibirFilmes(filmesFiltrados);
        }
    }
}

function limpar(){
    exibirFilmes(listaFilmes);
}

function exibirFilmes(filmes){
    listaAtual = filmes; 
    paginaAtual = 1;
    mostrarPagina();
}

function mostrarPagina(){
    lista_filmes.innerHTML = ``;

    let totalPaginas = Math.ceil(listaAtual.length / filmesPorPagina);
    if (totalPaginas == 0){
        totalPaginas = 1;
    }

    if (listaAtual.length == 0){
        lista_filmes.innerHTML = `<div class='vazio'>Nenhum filme encontrado.</div>`;
    } else {
        let inicio = (paginaAtual - 1) * filmesPorPagina;
        let fim = inicio + filmesPorPagina;

        if (fim > listaAtual.length){
            fim = listaAtual.length;
        }

        for (let i = inicio; i < fim; i++){
            let filme = listaAtual[listaAtual.length - 1 - i];
            let dataVisto = filme.dataVisto.slice(8, 10) + "/" + filme.dataVisto.slice(5, 7) + "/" + filme.dataVisto.slice(0, 4);

            lista_filmes.innerHTML += `
                <div class="filme">
                    <div class="filme-topo">
                        <span class="filme-nome">${filme.nomeFilme}</span>
                        <div class="filme-direita">
                            <span class="filme-data">Visto em ${dataVisto}</span>
                            <div class="menu">
                                <button class="btn-pontos" onclick="abrirMenu(${filme.idFilme})">⋮</button>
                                <div class="menu-opcoes" id="menu_${filme.idFilme}">
                                    <button onclick="editarFilme(${filme.idFilme})">Editar</button>
                                    <button class="deletar" onclick="deletarFilme(${filme.idFilme})">Deletar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <span class="filme-info">${filme.anoFilme} · ${filme.nomeDiretor} · ${filme.paisFilme}</span>
                    <span class="filme-genero">${filme.genero}</span>
                </div>`;
        }
    }

    texto_pagina.innerHTML = `Página ${paginaAtual} de ${totalPaginas}`;
    btn_anterior.disabled = (paginaAtual == 1);
    btn_proximo.disabled = (paginaAtual == totalPaginas);
}

function mudarPagina(direcao){
    paginaAtual += direcao; 
    mostrarPagina();
}

</script>
