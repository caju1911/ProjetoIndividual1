<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraplano</title>
</head>
<body>
    <nav class="navbar">
        <a href="#"><img src="img/search.svg" alt="Buscar"></a>
        <a href="index.html"><img src="img/logo.svg" alt="Logo" class="logo"></a>
        <a href="login.html" class="entrar"><img src="img/login.svg" alt="Login">Entrar</a>
    </nav>

<div class="secao" id="login">
    <span class="titulo">LOGIN</span>

    <div class="lista">
        <div class="card">
            <div class="formulario">

            <span class="descricao">E-mail:</span>
            <input type="text" id="email_input"> 
            <span class="descricao">Insira sua senha:</span>
            <input type="password" id="senha_input"> 
            <button onclick="entrar()" class="buttonCadastro">Entrar</button>
            <button onclick="esqueci()" class="buttonEsqueci">Esqueci minha senha</button>
            <p><a href="cadastro.html">Não possui conta? Clique aqui para se cadastrar!</a></p>
            

            </div>
        </div>
</body>
</html>
<script>


    function entrar() {

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            return false;
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./dashboard.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

</script>
